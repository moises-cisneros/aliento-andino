<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    rect.bg { fill: #111827; }
    rect.white-key { fill: #ffffff; }
    rect.black-key { fill: #1a1a2e; }
    rect.glow { fill: #06b6d4; opacity: 0.3; }
    @media (prefers-color-scheme: light) {
      rect.bg { fill: #e2e8f0; }
      rect.black-key { fill: #0f172a; }
      rect.glow { fill: #0891b2; opacity: 0.2; }
    }
  </style>
  <!-- Background -->
  <rect class="bg" width="32" height="32" rx="6"/>
  <!-- Glow -->
  <rect class="glow" x="3" y="6" width="26" height="20" rx="3"/>
  <!-- White keys -->
  <rect class="white-key" x="5" y="8" width="3" height="16" rx="0.5"/>
  <rect class="white-key" x="8.5" y="8" width="3" height="16" rx="0.5"/>
  <rect class="white-key" x="12" y="8" width="3" height="16" rx="0.5"/>
  <rect class="white-key" x="15.5" y="8" width="3" height="16" rx="0.5"/>
  <rect class="white-key" x="19" y="8" width="3" height="16" rx="0.5"/>
  <rect class="white-key" x="22.5" y="8" width="3" height="16" rx="0.5"/>
  <rect class="white-key" x="26" y="8" width="3" height="16" rx="0.5"/>
  <!-- Black keys -->
  <rect class="black-key" x="7" y="8" width="2.5" height="10" rx="0.5"/>
  <rect class="black-key" x="10.5" y="8" width="2.5" height="10" rx="0.5"/>
  <rect class="black-key" x="17.5" y="8" width="2.5" height="10" rx="0.5"/>
  <rect class="black-key" x="21" y="8" width="2.5" height="10" rx="0.5"/>
  <rect class="black-key" x="24.5" y="8" width="2.5" height="10" rx="0.5"/>
</svg>
