name: CI / Deploy to VM

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}  # ej: us-central1-docker.pkg.dev/PROJECT_ID/pianovision
  VM_HOST: ${{ secrets.VM_HOST }}                    # IP o dominio de la VM
  VM_USER: ${{ secrets.VM_USER }}                    # Usuario SSH de la VM
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # --- Job 0: Tests & Lint (gate antes de construir/desplegar) ---
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Backend: pytest (BLOQUEANTE) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run backend tests
        working-directory: backend
        env:
          DEBUG: "true"
          SECRET_KEY: ci-test-secret-key-not-used-in-production-0123456789
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
        run: pytest -q

      # --- Backend: ruff (informativo: hay deuda de estilo preexistente) ---
      - name: Lint backend (ruff)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install ruff
          ruff check app/ tests/

      # --- Web: ESLint (informativo) ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint web (eslint)
        working-directory: web
        continue-on-error: true
        run: |
          npm ci || npm install
          npm run lint

      # --- Mobile: flutter analyze (informativo) ---
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze mobile (flutter)
        working-directory: mobile
        continue-on-error: true
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

  # --- Job 1: Build y push imágenes (solo en push a main) ---
  build:
    name: Build & Push Docker Images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker $(echo $DOCKER_REGISTRY | cut -d'/' -f1) --quiet

      - name: Build & push backend image
        run: |
          docker build -t $DOCKER_REGISTRY/pianovision-backend:$IMAGE_TAG \
                        -t $DOCKER_REGISTRY/pianovision-backend:latest \
                        ./backend
          docker push $DOCKER_REGISTRY/pianovision-backend:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/pianovision-backend:latest

      - name: Build & push web image
        run: |
          docker build -t $DOCKER_REGISTRY/pianovision-web:$IMAGE_TAG \
                        -t $DOCKER_REGISTRY/pianovision-web:latest \
                        ./web
          docker push $DOCKER_REGISTRY/pianovision-web:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/pianovision-web:latest

  # --- Job 2: Deploy a la VM (solo en push a main) ---
  deploy:
    name: Deploy to VM
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $VM_HOST >> ~/.ssh/known_hosts

      - name: Copy deployment files to VM
        run: |
          scp -i ~/.ssh/deploy_key \
            infra/docker-compose.yml \
            $VM_USER@$VM_HOST:~/pianovision/

          scp -i ~/.ssh/deploy_key -r \
            infra/nginx/ \
            $VM_USER@$VM_HOST:~/pianovision/

      - name: Deploy on VM
        run: |
          ssh -i ~/.ssh/deploy_key $VM_USER@$VM_HOST << 'EOF'
            cd ~/pianovision

            # Autenticar Docker con Artifact Registry
            gcloud auth configure-docker $(echo ${{ env.DOCKER_REGISTRY }} | cut -d'/' -f1) --quiet

            # Setear tag de imagen y registry para docker-compose.yml interpolation
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}

            # Pull nuevas imágenes y recrear contenedores
            docker compose --env-file .env.production pull backend web
            docker compose --env-file .env.production up -d --no-deps backend web

            # Reiniciar nginx para re-resolver DNS de los nuevos containers
            docker compose --env-file .env.production restart nginx

            # Ejecutar migraciones de Alembic.
            # OJO: '< /dev/null' es CRÍTICO. 'docker compose exec -T' lee de stdin,
            # y como stdin es el heredoc del SSH, sin esto el exec se comía el
            # resto del script (¡los seeds nunca corrían!).
            docker compose --env-file .env.production exec -T backend alembic upgrade head < /dev/null

            # Ejecutar seeds (idempotentes). Capturamos la salida a un archivo y
            # la mostramos al final: el spam del 'docker pull' truncaba el log y
            # ocultaba errores del seed (que no son fatales por no usar set -e).
            SEED_LOG=/tmp/pv_seed.log
            : > "$SEED_LOG"
            docker compose --env-file .env.production exec -T backend python seed_achievements.py < /dev/null >> "$SEED_LOG" 2>&1 || echo "[deploy] seed_achievements exit $?" >> "$SEED_LOG"
            docker compose --env-file .env.production exec -T backend python seed_lessons.py < /dev/null >> "$SEED_LOG" 2>&1 || echo "[deploy] seed_lessons exit $?" >> "$SEED_LOG"
            docker compose --env-file .env.production exec -T backend python seed_all.py < /dev/null >> "$SEED_LOG" 2>&1 || echo "[deploy] seed_all exit $?" >> "$SEED_LOG"
            echo "===== INICIO SEED LOG ====="
            cat "$SEED_LOG"
            echo "===== FIN SEED LOG ====="

            # Limpiar imágenes viejas
            docker image prune -f

            echo "Deploy completado: $IMAGE_TAG"
          EOF

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key $VM_USER@$VM_HOST << 'EOF'
            set -e
            cd ~/pianovision
            echo "=== Contenedores activos ==="
            docker compose --env-file .env.production ps
            echo ""
            echo "=== Health check backend ==="
            backend_ready=false
            for attempt in {1..12}; do
              if curl -sf --connect-timeout 2 --max-time 5 http://localhost:8000/health > /dev/null; then
                backend_ready=true
                break
              fi
              echo "Esperando backend... ($attempt/12)"
              sleep 5
            done

            if [ "$backend_ready" != "true" ]; then
              echo "Backend FAIL"
              docker compose --env-file .env.production logs --tail=100 backend
              exit 1
            fi

            echo "Backend OK"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
