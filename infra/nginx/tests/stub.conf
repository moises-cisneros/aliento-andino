# Stub upstream used by run.sh: answers every backend/web/docs/ml request with 200.
events {}
http {
    server {
        listen 80;
        location / {
            default_type text/plain;
            return 200 "ok
";
        }
    }
    server {
        listen 8000;
        location = /api/big.txt {
            alias /data/big.txt;
            default_type text/plain;
        }
        location / {
            default_type text/plain;
            return 200 "ok
";
        }
    }
    server {
        listen 8001;
        location / {
            default_type text/plain;
            return 200 "ok
";
        }
    }
}
