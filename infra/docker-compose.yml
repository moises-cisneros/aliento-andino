# === Aliento Andino — Docker Compose (Producción VPS / Multi-Contenedor) ===
#
# Uso en VPS:
#   docker compose --env-file .env.production up -d
#
# Construcción local / manual:
#   docker compose -f infra/docker-compose.yml build

version: "3.8"

services:
  # --- PostgreSQL 16 ---
  db:
    image: postgres:16-alpine
    container_name: aliento-andino-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aliento_andino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aliento_andino}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aliento_andino} -d ${POSTGRES_DB:-aliento_andino}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- FastAPI Backend ---
  backend:
    image: ${DOCKER_REGISTRY:-alientoandino}/backend:${IMAGE_TAG:-latest}
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: aliento-andino-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aliento_andino}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aliento_andino}
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["https://alientoandino.org"]'}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:-https://alientoandino.org}
      DEBUG: "false"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Angular Web Admin Panel ---
  web:
    image: ${DOCKER_REGISTRY:-alientoandino}/web:${IMAGE_TAG:-latest}
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: aliento-andino-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:80"

  # --- Docusaurus Manual de Usuario ---
  docs:
    image: ${DOCKER_REGISTRY:-alientoandino}/docs:${IMAGE_TAG:-latest}
    build:
      context: ../apps/docs
      dockerfile: Dockerfile
    container_name: aliento-andino-docs
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"

  # --- Microservicio ML ---
  ml:
    image: ${DOCKER_REGISTRY:-alientoandino}/ml:${IMAGE_TAG:-latest}
    build:
      context: ../apps/ml
      dockerfile: Dockerfile
    container_name: aliento-andino-ml
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"

  # --- Nginx Reverse Proxy & Perimeter Gateway ---
  nginx:
    image: nginx:alpine
    container_name: aliento-andino-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
      docs:
        condition: service_started
      ml:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  # --- Certbot (SSL Let's Encrypt) ---
  certbot:
    image: certbot/certbot
    container_name: aliento-andino-certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "true"

volumes:
  pgdata:
  certbot_webroot:
  certbot_certs:
