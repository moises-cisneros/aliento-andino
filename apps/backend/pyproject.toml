[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions", "venv", ".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # function-call-in-default (FastAPI Depends uses this pattern)
    "B904",  # raise-from inside except (HTTPException re-raise pattern used across routers)
    "E712",  # SQLAlchemy needs `col == True/False`; the "fix" would change query semantics
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "E402", "N818", "C408", "E741"]  # tests: env setup before imports, fakes, terse names
"seed_*.py" = ["SIM102", "SIM105", "SIM108", "B007", "B905", "F841", "N802"]  # one-off seed scripts
"reseed_*.py" = ["SIM105"]  # one-off seed scripts
"app/utils/sql.py" = ["N801", "UP031"]  # SQLAlchemy `greatest` function element is lowercase by design
"alembic/**/*.py" = ["E402", "F401"]  # alembic migrations have specific patterns

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["venv", "alembic/versions"]
