<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente de fondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Gradiente Aliento Andino (Cyan a Violeta) -->
    <linearGradient id="alientoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Gradiente Caña Andina / Zampoña -->
    <linearGradient id="caneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Gradiente Tubo Activo -->
    <linearGradient id="activeCane" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>

    <!-- Gradiente Cinta Tradicional (Inti Naranja / Oro) -->
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Filtro de resplandor sutil -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Contenedor Base / Escudo -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Geometría Escalonada Andina (Chakana sutil de fondo) -->
  <path d="M 32 8 L 38 14 L 38 20 L 44 20 L 44 26 L 50 32 L 44 38 L 44 44 L 38 44 L 38 50 L 32 56 L 26 50 L 26 44 L 20 44 L 20 38 L 14 32 L 20 26 L 20 20 L 26 20 L 26 14 Z" 
        stroke="#06B6D4" stroke-opacity="0.12" stroke-width="1" fill="none" />

  <!-- Tubos de Zampoña / Sikus (Escalonados de mayor a menor) -->
  <!-- Tubo 1 (G4 / Sol) -->
  <rect x="13" y="16" width="5.5" height="34" rx="2.75" fill="url(#caneGrad)" stroke="#475569" stroke-width="0.8" />
  <ellipse cx="15.75" cy="18" rx="2" ry="1" fill="#06B6D4" opacity="0.6" />

  <!-- Tubo 2 (A4 / La) -->
  <rect x="20.5" y="20" width="5.5" height="30" rx="2.75" fill="url(#caneGrad)" stroke="#475569" stroke-width="0.8" />
  <ellipse cx="23.25" cy="22" rx="2" ry="1" fill="#06B6D4" opacity="0.7" />

  <!-- Tubo 3 (B4 / Si) -->
  <rect x="28" y="24" width="5.5" height="26" rx="2.75" fill="url(#activeCane)" stroke="#38BDF8" stroke-width="0.9" />
  <ellipse cx="30.75" cy="26" rx="2" ry="1" fill="#E0F2FE" />

  <!-- Tubo 4 (C5 / Do) -->
  <rect x="35.5" y="28" width="5.5" height="22" rx="2.75" fill="url(#caneGrad)" stroke="#475569" stroke-width="0.8" />
  <ellipse cx="38.25" cy="30" rx="2" ry="1" fill="#8B5CF6" opacity="0.7" />

  <!-- Tubo 5 (D5 / Re) -->
  <rect x="43" y="32" width="5.5" height="18" rx="2.75" fill="url(#caneGrad)" stroke="#475569" stroke-width="0.8" />
  <ellipse cx="45.75" cy="34" rx="2" ry="1" fill="#8B5CF6" opacity="0.6" />

  <!-- Cinta Tradicional de Amarre Andino (Ligadura de los tubos) -->
  <rect x="12" y="38" width="37.5" height="2.5" rx="1.2" fill="url(#bandGrad)" />
  <rect x="12" y="42" width="37.5" height="1.8" rx="0.9" fill="url(#bandGrad)" opacity="0.8" />

  <!-- Onda de Aliento y Sonido (Curva dinámica de soplido musical) -->
  <path d="M 8 28 C 14 12, 24 16, 32 20 C 40 24, 48 14, 56 18 C 58 19, 57 22, 53 21 C 46 19, 39 27, 31 23 C 23 19, 15 22, 10 32 C 8.5 35, 6.5 31, 8 28 Z"
        fill="url(#alientoGrad)" filter="url(#glow)" opacity="0.95" />

  <!-- Orificios tonales de Quena / Gotas de resonancia -->
  <circle cx="30.75" cy="26" r="1.5" fill="#FFFFFF" />
  <circle cx="48" cy="18" r="1.8" fill="#06B6D4" filter="url(#glow)" />
  <circle cx="53" cy="25" r="1.3" fill="#8B5CF6" filter="url(#glow)" />
  <circle cx="10" cy="22" r="1.2" fill="#38BDF8" opacity="0.8" />
</svg>
