org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# El cache incremental de Kotlin se corrompe cuando el código de un plugin vive
# en otra unidad (C:\...\Pub\Cache) distinta del proyecto (D:\...): la conversión
# a path relativo falla con "different roots". Desactivar el incremental evita
# ese error (Kotlin recompila sólo ante cambios nativos, no en el hot reload).
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
